name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · coverage · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgres://freedownload:freedownload_dev@localhost:5432/freedownload
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: freedownload
          POSTGRES_PASSWORD: freedownload_dev
          POSTGRES_DB: freedownload
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedownload"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Production dependencies only — dev-only advisories are tracked in
      # docs/security.md (the braces chain has no fixed release upstream).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare database
        run: |
          npm run db:migrate -w @freedownload/backend
          npm run db:seed

      - name: Tests
        run: npm test

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build api image
        run: docker build -f backend/Dockerfile --target api --tag freedownload-api:ci .

      - name: Build worker image
        run: docker build -f backend/Dockerfile --target worker --tag freedownload-worker:ci .
